# Unattended Debian installer answers for the Arthur's Laptop USB stick.
# @PLACEHOLDERS@ are filled in by iso/build-iso.sh.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i debian-installer/language string en
d-i debian-installer/country string US

# Everything comes from the USB stick: no network needed, none configured by the installer.
# (NetworkManager takes over on the installed system; Wi-Fi is added later or baked in.)
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string @HOSTNAME@
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean false
d-i hw-detect/firmware-lookup string never
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Grown-up account: no root login, this user gets sudo.
# The password is forced to be changed at first login (see late.sh).
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Grown-up
d-i passwd/username string parent
d-i passwd/user-password-crypted password @PARENT_HASH@

d-i clock-setup/utc boolean true
d-i time/zone string @TIMEZONE@
d-i clock-setup/ntp boolean false

# Disk: whole internal disk (never the USB stick; see pick-disk.sh).
d-i partman/early_command string sh /cdrom/kidos/pick-disk.sh
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Base system only; Kid OS packages come from the USB stick in late.sh.
tasksel tasksel/first multiselect
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false

d-i preseed/late_command string sh /cdrom/kidos/late.sh

# Power off at the end so the USB stick isn't booted again by accident.
d-i cdrom-detect/eject boolean false
d-i debian-installer/exit/poweroff boolean true
d-i finish-install/reboot_in_progress note
